apiVersion: v1
kind: Namespace
metadata:
  name: workaholic
---
apiVersion: v1
kind: Secret
metadata:
  name: workaholic
  namespace: workaholic
type: Opaque
stringData:
  SLACK_BOT_TOKEN: "xoxb-replace-me"
  SLACK_SIGNING_SECRET: "replace-me"
  WORKAHOLIC_API_TOKEN: "replace-me"
  OPENAI_API_KEY: "replace-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workaholic
  namespace: workaholic
  labels:
    app: workaholic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workaholic
  template:
    metadata:
      labels:
        app: workaholic
    spec:
      serviceAccountName: workaholic
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: workaholic:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODE
              value: k8s-container
            - name: LISTEN_ADDR
              value: ":8080"
            - name: SQLITE_PATH
              value: /data/workaholic.db
            - name: RUNBOOKS_DIR
              value: /runbooks
            - name: PROTECTED_NAMESPACES
              value: kube-system,monitoring,cert-manager
            - name: MAX_REPLICAS
              value: "30"
            - name: SLACK_CHANNEL
              value: "#incidents"
            - name: SLACK_APPROVER_IDS
              value: "U12345678,U87654321"
            - name: LLM_PROVIDER
              value: openai
            - name: AWS_REGION
              value: us-east-1
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workaholic
                  key: SLACK_BOT_TOKEN
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: workaholic
                  key: SLACK_SIGNING_SECRET
            - name: WORKAHOLIC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workaholic
                  key: WORKAHOLIC_API_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workaholic
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workaholic
  namespace: workaholic
spec:
  selector:
    app: workaholic
  ports:
    - name: http
      port: 8080
      targetPort: http
